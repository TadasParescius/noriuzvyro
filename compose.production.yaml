name: noriuzvyro-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noriuzvyro
      POSTGRES_USER: noriuzvyro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U noriuzvyro -d noriuzvyro']
      interval: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://noriuzvyro:${DB_PASSWORD}@db:5432/noriuzvyro
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: 'true'
      APP_ORIGINS: https://${DOMAIN:?Set DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
  certificates:
  caddy_config:
