# Local full application. Keeps the database volume from compose.yaml.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://noriuzvyro:local_lab1_password@db:5432/noriuzvyro
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: 'false'
      APP_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ':80'
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
